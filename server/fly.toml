# Deploying the relay to Fly.io.
#
# The relay is a post box, not a game server: it holds no state worth paying
# for and uses almost no CPU. What it does need is to be *near the players* —
# a relay on the wrong continent turns a 40ms round trip into 300ms, which
# costs more than any choice of architecture.
#
#   flyctl launch --config server/fly.toml --no-deploy   (once, to claim a name)
#   flyctl deploy --config server/fly.toml
#
# The app name has to be unique across all of Fly, so `flyctl launch` will
# offer you a free one if this is taken.

app = "salient-relay"

# Tokyo. From Taiwan this is roughly 35-45ms; hkg (Hong Kong) is nearer at
# 15-25ms if it has capacity when you deploy.
primary_region = "nrt"

[build]
  # These two are resolved relative to *this file*, while the build context is
  # the directory you run `flyctl deploy` from — the repository root, since the
  # Dockerfile copies server/ into the image. Hence the asymmetry: the
  # Dockerfile sits beside this file, the ignore file is one level up.
  dockerfile = "Dockerfile"
  ignorefile = "../.dockerignore"

[env]
  # Which pages may use this relay. Set it once the game has an address —
  # until then anybody can, which is fine while nobody knows it exists.
  # ALLOWED_ORIGINS = "https://your-game.pages.dev"

[http_service]
  internal_port = 8787
  # A browser on an HTTPS page refuses a plain ws:// socket, so the relay has
  # to be reachable over TLS. Fly terminates it in front of the container,
  # which is why the relay itself speaks plain ws.
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Nothing needs to be running when nobody is playing. An open WebSocket
  # counts as an active connection, so a match in progress will not be
  # suspended underneath it.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  # The smallest thing Fly sells is more than enough to forward JSON.
  size = "shared-cpu-1x"
  memory = "256mb"
