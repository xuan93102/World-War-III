# Deploying the relay to Cloudflare Workers.
#
#   npx wrangler deploy --config server/wrangler.toml
#
# The name has to be unique within your account, and becomes the address:
# https://<name>.<your-subdomain>.workers.dev

name = "salient-relay"
main = "relay.worker.js"
compatibility_date = "2026-08-22"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
# SQLite-backed, not because a room stores much — one token — but because
# these are the Durable Objects the free plan will run at all.
new_sqlite_classes = ["Room"]

[dev]
# Matches the address the game falls back to when VITE_RELAY_URL is unset, so
# local development needs no configuration at all.
port = 8787

[vars]
# Which pages may use this relay. Set it once the game has an address — until
# then anybody can, which is fine while nobody knows it exists.
# ALLOWED_ORIGINS = "https://your-game.workers.dev"
